# MCMA production V1 routes for mailit.click.
#
# This file is intentionally a server-block fragment. It is installed as:
#   /etc/nginx/mcma-mailit-v1-managed.conf
# and included by:
#   /etc/nginx/mcma-mailit.conf
#
# Historical /mcma/v2/* compatibility locations remain outside this managed
# fragment and are preserved by scripts/deploy-mailit-nginx.sh.

location = /mcma {
    return 301 /mcma/;
}

location = /mcma/ {
    alias /var/www/memory/apps/web/public/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
}

location = /mcma/favicon.svg {
    alias /var/www/memory/apps/web/public/favicon.svg;
    default_type image/svg+xml;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /mcma/app.css {
    alias /var/www/memory/apps/web/public/app.css;
    default_type text/css;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /mcma/app.js {
    alias /var/www/memory/apps/web/public/app.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /mcma/admin.html {
    alias /var/www/memory/apps/web/public/admin.html;
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /mcma/admin.js {
    alias /var/www/memory/apps/web/public/admin.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# OIDC endpoints. Generation is not expected here, but keeping the same
# FastCGI timeout profile avoids inconsistent proxy behavior during slow IdP
# round trips and keeps the deployment fragment uniform.
location = /mcma/login {
    fastcgi_read_timeout 180s;
    fastcgi_send_timeout 180s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/memory/apps/web/public/index.php;
    fastcgi_param SCRIPT_NAME /mcma/login;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php-fpm-mcma/mcma.sock;
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
}

location = /mcma/callback {
    fastcgi_read_timeout 180s;
    fastcgi_send_timeout 180s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/memory/apps/web/public/index.php;
    fastcgi_param SCRIPT_NAME /mcma/callback;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php-fpm-mcma/mcma.sock;
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
}

location = /mcma/logout {
    fastcgi_read_timeout 180s;
    fastcgi_send_timeout 180s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/memory/apps/web/public/index.php;
    fastcgi_param SCRIPT_NAME /mcma/logout;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php-fpm-mcma/mcma.sock;
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
}

# Current MCMA API. The 180-second FastCGI timeout is the primary proxy
# protection for long Bedrock/local generation. Client request_id recovery is
# the second line of defense if CloudFront/mobile networking ends first.
location ^~ /mcma/v1/ {
    fastcgi_read_timeout 180s;
    fastcgi_send_timeout 180s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/memory/apps/web/public/index.php;
    fastcgi_param SCRIPT_NAME /mcma/v1;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php-fpm-mcma/mcma.sock;

    client_max_body_size 1m;

    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
}

# Any other MCMA V1/static route not explicitly declared above is closed.
# More-specific historical /mcma/v2/* locations declared by the parent
# include continue to win by Nginx location precedence.
location ^~ /mcma/ {
    return 404;
}
