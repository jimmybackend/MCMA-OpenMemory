name: PHP Core Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP version
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80200) { fwrite(STDERR, "PHP 8.2+ required\n"); exit(1); }'

      - name: PHP lint
        run: |
          find packages tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l apps/cli/mcma
          php -l apps/web/public/index.php

      - name: Installer shell checks
        run: |
          bash -n install.sh
          bash -n scripts/mcma-doctor.sh
          bash install.sh --help >/tmp/mcma-install-help.txt
          bash scripts/mcma-doctor.sh --help >/tmp/mcma-doctor-help.txt
          grep -q "MCMA-OpenMemory installer" /tmp/mcma-install-help.txt
          grep -q "MCMA doctor" /tmp/mcma-doctor-help.txt

      - name: MCMA conformance
        run: |
          php tests/conformance/run.php
          php tests/conformance/jcs-numbers.php
          php tests/conformance/aws-sigv4-s3.php
          php tests/conformance/oop-production.php

      - name: CLI OOP smoke
        run: |
          set +e
          php apps/cli/mcma --help >/tmp/mcma-cli-help.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q "MCMA 1.0 CLI" /tmp/mcma-cli-help.txt

      - name: Core integrations
        run: |
          php tests/integration/local-core.php
          php tests/integration/historical-migration.php

      - name: Storage integrations
        run: |
          php tests/integration/storage-adapters.php
          php tests/integration/github-storage-adapter.php
          php tests/integration/s3-storage-adapter.php
          php tests/integration/provider-migration-s3.php
          php tests/integration/webdav-storage-adapter.php
          php tests/integration/provider-migration-webdav.php
          php tests/integration/multicloud-storage-adapters.php

      - name: Multi-user isolation
        run: php tests/integration/multiuser.php

      - name: Web application
        run: |
          php tests/integration/web-oidc.php
          php tests/integration/web-application.php
          php tests/integration/web-static-base-path.php

      - name: Billing and commercial API
        run: |
          php tests/integration/billing-metering-admin.php
          php tests/integration/web-billing-api.php
          php tests/integration/stripe-checkout-webhook.php
          php tests/integration/stripe-subscription-renewal.php

      - name: Permissions and vault
        run: php tests/integration/permissions-vault.php

      - name: Knowledge reuse and agents
        run: php tests/integration/knowledge-core.php

      - name: Semantic retrieval
        run: |
          php tests/integration/semantic-retrieval.php
          php tests/integration/semantic-incremental-topk.php
          php tests/integration/bedrock-embedding-provider.php

      - name: Ask orchestration
        run: |
          php tests/integration/ask-orchestration.php
          php tests/integration/bedrock-converse-provider.php

      - name: Local AI providers
        run: |
          php tests/integration/ollama-local-providers.php
          php tests/integration/llamacpp-local-providers.php
