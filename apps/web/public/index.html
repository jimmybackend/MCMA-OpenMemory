<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCMA OpenMemory</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>MCMA OpenMemory</h1>
        <p>Memoria cifrada, multiusuario y portable.</p>
      </div>
      <div class="actions">
        <span id="status">Comprobando sesión…</span>
        <a id="login" href="/login" hidden>Iniciar sesión</a>
        <button id="logout" type="button" hidden>Salir</button>
      </div>
    </header>

    <section id="account" class="card" hidden>
      <strong>Biblioteca</strong>
      <span id="library"></span>
    </section>

    <section id="registerBox" class="card" hidden>
      <p>Tu identidad está autenticada pero aún no tiene una biblioteca MCMA registrada.</p>
      <button id="register" type="button">Crear mi memoria</button>
    </section>

    <section class="card">
      <form id="askForm">
        <label for="question">Pregunta</label>
        <textarea id="question" maxlength="32768" required placeholder="Escribe una pregunta…"></textarea>
        <div class="row">
          <label><input id="current" type="checkbox"> Exigir información actual</label>
          <label><input id="remember" type="checkbox" checked> Recordar respuesta nueva</label>
          <button id="send" type="submit">Preguntar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <pre id="answer">La respuesta aparecerá aquí.</pre>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
